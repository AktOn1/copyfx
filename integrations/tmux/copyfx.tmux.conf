# CopyFX yank feedback for tmux copy-mode (vi keys). Add to ~/.tmux.conf:   source-file /path/to/copyfx.tmux.conf
#
# `y` copies the selection to the system clipboard, keeps the selection (highlight) on screen for a moment and tells CopyFX the exact colour of
# that highlight (mode-style background; "##" is tmux's escape for a literal "#"), so the effect plays right over the yanked text. Then the copy mode is left.
set -g mode-keys vi
set -g mode-style "bg=#3465a4,fg=#ffffff"          # the selection colour: keep it in sync with the hex below
bind -T copy-mode-vi y send -X copy-pipe-no-clear "copyfx-yank-pipe '##3465a4'" \; run-shell -b "sleep 0.45; tmux send-keys -X cancel"
